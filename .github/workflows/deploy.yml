name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Playwright liegt als Werkzeug fuer die Teststrecken im Repo (e2e/), lauft aber
# NICHT in dieser Aktion: ein Lauf braucht einen echten Browser und einen Build,
# und ein roter Lauf hier wuerde jeden Merge aufhalten. Ohne diese Zeile holt die
# Installation trotzdem vier Browser (rund 500 MB) und macht die Aktion langsam.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Basis-Pfad IMMER aus dem echten Repo-Namen ableiten: GitHub Pages ist
        # im Pfadsegment case-sensitiv, und so übersteht das Deployment jede
        # weitere Umbenennung ohne Handarbeit.
      - name: Build (Pages-Basis aus dem Repo-Namen)
        run: PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" pnpm build
        # Deep-Links (…/wuerfel, …/charaktere/<id>) treffen auf Pages keine echte
        # Datei — die 404-Seite liefert deshalb die App aus, der Router übernimmt.
      - name: SPA-Fallback für Deep-Links
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
